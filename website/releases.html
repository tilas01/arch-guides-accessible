<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Arch Guides | Releases</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            /* Inherits variables from style.css */
            font-family: var(--font-mono);
        }
        .releases-container {
            max-width: 800px;
            margin: 2rem auto;
            background: #24283b;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #414868;
        }
        .banner {
            text-align: center;
            margin-bottom: 2rem;
        }
        .banner img {
            max-width: 100%;
            border-radius: 12px;
            border: 2px solid #7aa2f7;
        }
        .rate-limit {
            text-align: right;
            font-size: 0.85rem;
            color: #f7768e;
            margin-bottom: 1rem;
            font-weight: bold;
        }
        .release-item {
            background: #1a1b26;
            border: 1px solid #565f89;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: transform 0.2s;
        }
        .release-item:hover {
            transform: translateY(-2px);
            border-color: #bb9af7;
        }
        .release-title {
            color: #7aa2f7;
            font-size: 1.4rem;
            margin: 0 0 0.5rem 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .release-date {
            color: #9ece6a;
            font-size: 0.9rem;
        }
        .asset-link {
            display: inline-block;
            background: #7aa2f7;
            color: #1a1b26;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 1rem;
            margin-right: 0.5rem;
        }
        .asset-link:hover {
            background: #bb9af7;
        }
        .back-btn {
            display: inline-block;
            color: #7aa2f7;
            text-decoration: none;
            margin-bottom: 1rem;
            font-weight: bold;
        }
        .back-btn:hover {
            color: #bb9af7;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="releases-container">
        <a href="index.html" class="back-btn">&larr; Back to Generator</a>
        <div class="banner">
            <img src="img/banner.png" alt="ARSS Hub Banner" onerror="this.style.display='none'">
            <h1 style="color:#bb9af7; margin-top:1rem;">Official Module Releases</h1>
            <p>Download the latest standalone binaries for Arch Rusty Security Suite.</p>
        </div>

        <div class="rate-limit" id="rate-limit-display">Checking GitHub API Limits...</div>

        <div id="releases-list">
            <p style="text-align:center; color:#e0af68;">Loading releases from GitHub...</p>
        </div>
    </div>

    <script>
        function showOverlay(message) {
            const overlay = document.createElement('div');
            overlay.style.position = 'fixed';
            overlay.style.top = '0';
            overlay.style.left = '0';
            overlay.style.width = '100vw';
            overlay.style.height = '100vh';
            overlay.style.backgroundColor = 'rgba(26, 27, 38, 0.9)';
            overlay.style.display = 'flex';
            overlay.style.flexDirection = 'column';
            overlay.style.justifyContent = 'center';
            overlay.style.alignItems = 'center';
            overlay.style.zIndex = '9999';
            
            const msgBox = document.createElement('div');
            msgBox.style.background = '#24283b';
            msgBox.style.padding = '2rem';
            msgBox.style.borderRadius = '12px';
            msgBox.style.border = '2px solid #f7768e';
            msgBox.style.color = '#c0caf5';
            msgBox.style.fontSize = '1.2rem';
            msgBox.style.textAlign = 'center';
            msgBox.style.boxShadow = '0 10px 30px rgba(0,0,0,0.8)';
            msgBox.innerHTML = `<h3>⚠️ Notice</h3><p>${message}</p>`;

            const closeBtn = document.createElement('button');
            closeBtn.textContent = 'Close';
            closeBtn.style.marginTop = '1rem';
            closeBtn.style.padding = '0.5rem 1rem';
            closeBtn.style.background = '#f7768e';
            closeBtn.style.color = '#1a1b26';
            closeBtn.style.border = 'none';
            closeBtn.style.borderRadius = '6px';
            closeBtn.style.cursor = 'pointer';
            closeBtn.style.fontWeight = 'bold';
            closeBtn.onclick = () => document.body.removeChild(overlay);

            msgBox.appendChild(closeBtn);
            overlay.appendChild(msgBox);
            document.body.appendChild(overlay);

            setTimeout(() => {
                if(document.body.contains(overlay)) {
                    document.body.removeChild(overlay);
                }
            }, 5000);
        }

        async function fetchReleases() {
            const listDiv = document.getElementById('releases-list');
            const rateDiv = document.getElementById('rate-limit-display');
            const fallbackUrl = 'https://github.com/tilas01/arch-guides-dynamic/releases';
            const cacheKey = 'gh_releases_cache';

            function renderData(data) {
                if (data.length === 0) {
                    listDiv.innerHTML = '<p style="text-align:center;">No releases found.</p>';
                    return;
                }
                let html = '';
                data.forEach(release => {
                    const date = new Date(release.published_at).toLocaleString();
                    let assetsHtml = '';
                    
                    release.assets.forEach(asset => {
                        assetsHtml += `<a href="${asset.browser_download_url}" class="asset-link">⬇️ ${asset.name}</a>`;
                    });

                    html += `
                        <div class="release-item">
                            <h2 class="release-title">
                                ${release.name || release.tag_name}
                                <span class="release-date">🕒 Last Update: ${date}</span>
                            </h2>
                            <p style="color:#c0caf5;">${release.body || 'No release notes provided.'}</p>
                            ${assetsHtml}
                        </div>
                    `;
                });
                listDiv.innerHTML = html;
            }

            // Check cache first
            const cached = sessionStorage.getItem(cacheKey);
            if (cached) {
                rateDiv.textContent = 'API Tokens Remaining: (Cached Session)';
                try {
                    renderData(JSON.parse(cached));
                    return; // Skip fetch if cached
                } catch(e) {}
            }

            try {
                const response = await fetch('https://api.github.com/repos/tilas01/arch-guides-dynamic/releases');
                
                // Track API Limit
                const limitLeft = response.headers.get('x-ratelimit-remaining');
                if (limitLeft !== null) {
                    rateDiv.textContent = `API Tokens Remaining: ${limitLeft}`;
                    if (parseInt(limitLeft) <= 0) {
                        throw new Error('API Limits Exhausted'); // trigger catch block
                    }
                }

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const data = await response.json();
                sessionStorage.setItem(cacheKey, JSON.stringify(data));
                renderData(data);

            } catch (error) {
                rateDiv.textContent = 'API Tokens Exhausted! (Using Static Fallback)';
                rateDiv.innerHTML += ` — <a href="${fallbackUrl}" target="_blank" style="color:var(--accent-blue);text-decoration:underline;">Visit GitHub Directly</a>`;
                
                // Render Static Fallback
                listDiv.innerHTML = `
                    <div class="alert warning" style="background-color:rgba(247,118,142,0.1); border:1px solid #f7768e; padding:1rem; border-radius:8px; margin-bottom:2rem; color:#f7768e; font-weight:bold;">
                        ⚠️ GitHub API Limit Exceeded. Showing statically cached releases instead.
                    </div>
                    
                    <div class="release-item">
                        <h2 class="release-title">
                            Arch Rusty Security Suite v1.0.0
                            <span class="release-date">🕒 Last Update: Static Build</span>
                        </h2>
                        <p style="color:#c0caf5;">Official dynamic installer drop featuring Anti-Ducky, Libre OTP, and Kernel Watcher modules.</p>
                        <a href="https://github.com/tilas01/arch-guides-dynamic/releases" target="_blank" class="asset-link">⬇️ View All Assets on GitHub</a>
                    </div>
                    
                    <div class="release-item">
                        <h2 class="release-title">
                            Arch Guides Dynamic v0.9.5-beta
                            <span class="release-date">🕒 Last Update: Static Build</span>
                        </h2>
                        <p style="color:#c0caf5;">Previous stable release containing the base generator UI.</p>
                        <a href="https://github.com/tilas01/arch-guides-dynamic/releases" target="_blank" class="asset-link">⬇️ View All Assets on GitHub</a>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', fetchReleases);
    </script>
</body>
</html>
