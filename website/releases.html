<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Tools Releases & Wiki</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-bottom:1.5rem; padding-bottom:1rem; border-bottom:1px solid var(--border-color);">
        <a href="index.html" class="btn" style="width:auto; background:var(--bg-lighter); color:var(--accent-blue); padding:0.5rem 1rem;">&larr; Back to Generator</a>
        <h2 style="color:var(--accent-purple); margin:0;">Security Tools Releases & Wiki</h2>
    </header>

    <div class="layout-container">
        <section style="width:100%; max-width:900px; margin: 0 auto;">
            <div id="release-container" style="background:var(--bg-darker); border:1px solid var(--border-color); border-radius:12px; padding:2rem; min-height: 400px; display:flex; flex-direction:column; justify-content:center; align-items:center;">
                <div class="spinner" id="loading-spinner" style="border: 4px solid var(--bg-lighter); border-top: 4px solid var(--accent-blue); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;"></div>
                <p id="loading-text" style="color:var(--accent-cyan); margin-top:1rem; font-family:var(--font-mono);">Fetching latest releases from GitHub API...</p>
            </div>
            
            <style>
                @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
                .asset-btn {
                    display: inline-flex;
                    align-items: center;
                    gap: 8px;
                    background: var(--bg-lighter);
                    border: 1px solid var(--border-color);
                    color: var(--fg-color);
                    padding: 0.8rem 1.2rem;
                    border-radius: 8px;
                    text-decoration: none;
                    font-family: var(--font-mono);
                    transition: all 0.2s;
                }
                .asset-btn:hover {
                    background: var(--accent-purple);
                    color: var(--bg-darker);
                    transform: translateY(-2px);
                }
                .markdown-body h1, .markdown-body h2, .markdown-body h3 { color: var(--accent-blue); margin-top: 1.5rem; }
                .markdown-body ul { padding-left: 1.5rem; }
                .markdown-body code { background: #111; padding: 0.2rem 0.4rem; border-radius: 4px; color: var(--accent-red); }
            </style>

            <script>
                document.addEventListener('DOMContentLoaded', async () => {
                    const container = document.getElementById('release-container');
                    try {
                        const response = await fetch('https://api.github.com/repos/tilas01/arch_guides_all_versions/releases/latest');
                        if (!response.ok) throw new Error('API Rate Limited or Release Not Found');
                        const data = await response.json();
                        
                        let assetsHtml = '';
                        if (data.assets && data.assets.length > 0) {
                            assetsHtml = data.assets.map(a => `<a href="${a.browser_download_url}" class="asset-btn" target="_blank">ðŸ“¦ ${a.name} <span style="opacity:0.5; font-size:0.8rem;">(${(a.size/1024/1024).toFixed(2)} MB)</span></a>`).join(' ');
                        } else {
                            assetsHtml = '<p style="color:var(--accent-orange);">No compiled binaries found for this release.</p>';
                        }

                        // Basic markdown parsing for notes
                        let bodyParsed = data.body
                            .replace(/### (.*)/g, '<h3>$1</h3>')
                            .replace(/## (.*)/g, '<h2>$1</h2>')
                            .replace(/# (.*)/g, '<h1>$1</h1>')
                            .replace(/\*\*(.*)\*\*/g, '<strong>$1</strong>')
                            .replace(/`([^`]+)`/g, '<code>$1</code>')
                            .replace(/\n/g, '<br>');

                        container.style.display = 'block';
                        container.innerHTML = `
                            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); padding-bottom:1rem; margin-bottom:1.5rem;">
                                <h2 style="color:var(--accent-green); margin:0;">${data.name || data.tag_name}</h2>
                                <span style="background:var(--accent-cyan); color:var(--bg-darker); padding:0.3rem 0.8rem; border-radius:20px; font-weight:bold; font-size:0.9rem;">${data.tag_name}</span>
                            </div>
                            <div class="markdown-body" style="color:var(--fg-color); font-size:0.95rem; line-height:1.6; margin-bottom:2rem;">
                                ${bodyParsed || 'No release notes provided.'}
                            </div>
                            <h3 style="color:var(--accent-purple); border-top:1px solid var(--border-color); padding-top:1.5rem;">Downloads & Assets</h3>
                            <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:1rem;">
                                ${assetsHtml}
                                <a href="${data.html_url}" class="asset-btn" target="_blank" style="background:var(--bg-color);">ðŸ”— View on GitHub</a>
                                <a href="wiki.html" class="asset-btn" style="background:var(--accent-blue); color:var(--bg-color);">ðŸ“– Read Tool Wiki</a>
                            </div>
                        `;
                    } catch (e) {
                        container.innerHTML = `
                            <div class="alert error" style="width:100%;">
                                <h3 style="margin-top:0;">âš ï¸  GitHub API Failed</h3>
                                <p>Unable to fetch the latest release dynamically. You may be rate limited by GitHub.</p>
                                <div style="margin-top:1.5rem; display:flex; gap:10px;">
                                    <a href="https://github.com/tilas01/arch_guides_all_versions/releases" class="btn" style="background:var(--accent-red); color:var(--bg-darker);">Go to GitHub Releases Page directly</a>
                                    <a href="wiki.html" class="btn" style="background:var(--accent-blue); color:var(--bg-darker);">View Tool Wiki</a>
                                </div>
                            </div>
                        `;
                    }
                });
            </script>
        </section>
    </div>
</body>
</html>
