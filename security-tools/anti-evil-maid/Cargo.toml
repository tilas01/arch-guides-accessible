[package]
name = "anti-evil-maid"
version = "1.0.0"
edition = "2024"

[dependencies]
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
chrono = "0.4"
rpassword = "7.0"
zeroize = "1.6"
kernel-watcher = { path = "../kernel-watcher" }

eframe = "0.27.2"
egui = "0.27.2"
udev = "0.9.3"
dialoguer = "0.12.0"

clap = { version = "4.5.4", features = ["derive"] }
chacha20poly1305 = "0.10.1"
rand = "0.10.1"
aead = "0.6.1"
pqcrypto-kyber = "0.8.1"
pqcrypto-traits = "0.3.5"

[[bin]]
name = "anti-evil-maid"
path = "src/main.rs"
