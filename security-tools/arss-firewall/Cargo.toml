[package]
name = "arss-firewall"
version = "0.1.0"
edition = "2024"
description = "A Little Snitch clone for Arch Linux using eBPF and egui"

[dependencies]
eframe = "0.27.2"
egui = "0.27.2"
tokio = { version = "1.37", features = ["full"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.12.0"
aya-log = "0.2.0"
