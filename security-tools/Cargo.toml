[workspace]
members = [
    "anti-ducky",
    "libre-otp",
    "arch-iso-verifier", "kernel-watcher", "scarecrow", "anti-evil-maid",
]
resolver = "2"

[package]
name = "arch-rusty-security-suite"
version = "1.0.0"
edition = "2024"
description = "Arch Rusty Security Suite by tilas01 — a unified security toolkit combining USB HID input protection, TOTP/OTP 2FA, ISO verification, and release integrity checking."
license = "GPL-3.0-or-later"

[profile.release]
opt-level = 3       # Optimize for size
lto = true            # Enable Link-Time Optimization
codegen-units = 1     # Maximize size reduction optimizations
panic = "abort"       # Abort on panic (removes panic unwinding code)
strip = true          # Strip symbols from binary

[[bin]]
name = "arch-rusty-security-suite"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"

# Workspace member crates
anti-ducky = { path = "anti-ducky" }
libre-otp = { path = "libre-otp" }
arch-iso-verifier = { path = "arch-iso-verifier" }
kernel-watcher = { path = "kernel-watcher" }
scarecrow = { path = "scarecrow" }
anti-evil-maid = { path = "anti-evil-maid" }
