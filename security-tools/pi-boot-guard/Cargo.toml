[package]
name = "pi-boot-guard"
version = "1.0.0"
edition = "2024"
description = "Reports Raspberry Pi secure-boot state and verifies the boot partition against a recorded baseline. Reads and reports; never fuses OTP."

[dependencies]
suite-hardening = { path = "../suite-hardening" }
clap = { version = "4.5.4", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"

[[bin]]
name = "pi-boot-guard"
path = "src/main.rs"

[profile.release]
# Kept on across the suite: these parse untrusted input, and a silent integer
# wrap in a parser is how a length check stops being a length check.
overflow-checks = true
