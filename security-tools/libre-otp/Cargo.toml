[package]
name = "libre-otp"
version = "0.1.0"
edition = "2021"
description = "Native Rust OTP authenticator designed for PAM integration without proprietary backends."

[lib]
name = "libre_otp"
path = "src/lib.rs"

[[bin]]
name = "libre-otp"
path = "src/main.rs"

[dependencies]
totp-rs = { version = "5.5.1", features = ["gen_secret"] }
rpassword = "7.3"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
data-encoding = "2.6"
