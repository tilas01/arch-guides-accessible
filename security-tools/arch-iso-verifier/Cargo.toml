[package]
name = "arch-iso-verifier"
version = "0.1.0"
edition = "2021"
description = "Verify Arch Linux ISO integrity against official SHA256 checksums."

[lib]
name = "arch_iso_verifier"
path = "src/lib.rs"

[[bin]]
name = "arch-iso-verifier"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
hex = "0.4"
