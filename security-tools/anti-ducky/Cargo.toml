[package]
name = "anti-ducky"
version = "1.0.0"
edition = "2021"
description = "Intelligent USB HID Input Manager - detects, sandboxes, and alerts on RubberDucky/BadUSB payloads. Requires 2-of-N approved inputs to authorize a new device."

[lib]
name = "anti_ducky"
path = "src/lib.rs"

[[bin]]
name = "anti-ducky"
path = "src/main.rs"
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
eframe = "0.27.2"
egui = "0.27.2"

clap = { version = "4.5.4", features = ["derive"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
rpassword = "7.2"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12.2"
