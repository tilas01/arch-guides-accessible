name: Build kernel-watcher

on:
  push:
    branches:
      - main
    paths:
      - 'security-tools/kernel-watcher/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Release
        run: cargo build --release
        working-directory: security-tools/kernel-watcher
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-watcher-binary
          path: security-tools/kernel-watcher/target/release/kernel-watcher
