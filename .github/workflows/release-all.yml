name: Release Security Tools

on:
  push:
    branches:
      - dev
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: [libre-otp, anti-ducky, anti-evil-maid, kernel-watcher, scarecrow]
    
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Ubuntu Dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      - name: Build Release
        run: cargo build --release
        working-directory: security-tools/${{ matrix.tool }}

      - name: Generate Hashes
        run: |
          cd security-tools/${{ matrix.tool }}/target/release
          sha512sum ${{ matrix.tool }} > ${{ matrix.tool }}.sha512
          sha256sum ${{ matrix.tool }} > ${{ matrix.tool }}.sha256

      # Signing is all-or-nothing on purpose. This step used to fall back to
      # writing the literal text "DUMMY SIG" into <tool>.sig and <tool>.asc when
      # the secret was absent, and those files were then published as release
      # assets. Anyone following the README's verification instructions would
      # have hit a bogus signature file while the docs claimed every binary was
      # signed. Now: sign properly, or publish hashes only and say so.
      - name: Generate GPG Signatures
        id: sign
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd "security-tools/${{ matrix.tool }}/target/release"
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::warning::GPG_PRIVATE_KEY is not set - publishing SHA-256/512 hashes only, no signatures."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          printf '%s' "${GPG_PASSPHRASE:-}" | gpg --batch --yes \
            --passphrase-fd 0 --pinentry-mode loopback \
            -u tilas01 --detach-sign --armor \
            --output "${{ matrix.tool }}.sig" "${{ matrix.tool }}"
          # verify-integrity.sh looks for .asc; keep both names for the same
          # armored detached signature.
          cp "${{ matrix.tool }}.sig" "${{ matrix.tool }}.asc"
          # Fail loudly rather than shipping a signature that does not verify.
          gpg --verify "${{ matrix.tool }}.sig" "${{ matrix.tool }}"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tool }}-release
          # if-no-files-found: ignore so an unsigned build (no .sig/.asc) still
          # uploads its binary and hashes instead of failing the whole job.
          if-no-files-found: ignore
          path: |
            security-tools/${{ matrix.tool }}/target/release/${{ matrix.tool }}
            security-tools/${{ matrix.tool }}/target/release/${{ matrix.tool }}.sha512
            security-tools/${{ matrix.tool }}/target/release/${{ matrix.tool }}.sha256
            security-tools/${{ matrix.tool }}/target/release/${{ matrix.tool }}.sig
            security-tools/${{ matrix.tool }}/target/release/${{ matrix.tool }}.asc

  create-release:
    needs: build-and-release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
      
      - name: Prepare Assets
        run: |
          mkdir -p final_release
          find release_assets -type f -exec cp {} final_release/ \;
          ls -la final_release/

      - name: Generate Tag
        id: tag
        run: |
          echo "tag=v$(date +'%Y.%m.%d-%H%M')-${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Security Tools Release (${{ github.ref_name }})"
          files: final_release/*
          draft: false
          prerelease: ${{ github.ref_name == 'dev' }}
