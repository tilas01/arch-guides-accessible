name: Deploy Website to GitHub Pages

on:
  workflow_run:
    workflows: ["Security Tools CI & Release"]
    types:
      - completed
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Prepare Website Assets
        run: |
          # Copy root docs to website/docs/ without overwriting (website/docs has comprehensive versions)
          cp -rn docs/* website/docs/ 2>/dev/null || true
          cp -rn img website/ 2>/dev/null || true
          
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './website'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
