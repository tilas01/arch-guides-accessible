name: Deploy Website to GitHub Pages

on:
  # Deploy directly when the site changes on main. The workflow_run chain below
  # already covers the normal case, but it depends on "Release Security Tools"
  # completing first; this makes a website-only change deploy even if the Rust
  # release job fails.
  push:
    branches: ["main"]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'img/**'
      - '.github/workflows/pages.yml'
  # Still redeploy after a release, so the static release assets are refreshed.
  workflow_run:
    workflows: ["Release Security Tools"]
    types:
      - completed
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Website Assets
        run: |
          # website/docs holds the comprehensive copies, so -n (no-clobber)
          # keeps them and only fills in anything missing from the root docs.
          mkdir -p website/docs
          cp -rn docs/* website/docs/ 2>/dev/null || true
          cp -rn img website/ 2>/dev/null || true

      - name: Verify the site is intact before publishing
        run: |
          set -euo pipefail
          cd website
          # Every page the nav links to must exist, or we publish 404s.
          for page in index.html site-index.html manual.html wiki.html \
                      iso-verify.html live.html security-tools.html \
                      releases.html repo.html \
                      style.css script.js tooltip.js legal.js shared-ui.js \
                      manual-data.js manual-guide.js manual.js \
                      iso-verify.js site-index.js search-index.json; do
            test -f "$page" || { echo "FATAL: website/$page is missing"; exit 1; }
          done
          # A SyntaxError in a classic <script> stops the whole file executing,
          # which is exactly how this site shipped broken for 12 commits. Refuse
          # to publish one. Every script, not a hand-maintained list that new
          # files get forgotten from.
          for js in *.js; do
            node --check "$js" || { echo "FATAL: $js does not parse"; exit 1; }
          done
          # The search index is generated; a malformed one silently disables
          # search on the page the site tells people to start from.
          node -e "
            const d = require('./search-index.json');
            if (!Array.isArray(d) || d.length < 100) {
              throw new Error('search-index.json has ' + (d.length ?? '?') + ' entries');
            }
            for (const e of d) {
              if (!e.t || !e.u) throw new Error('index entry missing t or u: ' + JSON.stringify(e));
            }
            console.log('search index: ' + d.length + ' entries');
          "
          echo "Pre-publish checks passed."

      # node --check catches a file that cannot parse. It says nothing about a
      # file that parses and produces the wrong thing, which is the layer these
      # catch: 578 permutations of the walkthrough asserted on content, every
      # generated script through `bash -n`, structural responsive checks, and
      # html-validate on all nine pages.
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
        working-directory: tests

      # Run separately rather than through `npm test`, so a failure names itself
      # in the job summary instead of showing up as "npm test exited 1".
      - name: "Test: 578 generator permutations"
        run: npm run permutations
        working-directory: tests

      - name: "Test: responsive structure"
        run: npm run responsive
        working-directory: tests

      # The two front ends are separate tools that share a config format. This
      # asserts a config from either actually configures the other, and that the
      # mapping never invents an answer or guesses a destructive setting.
      - name: "Test: config translation between generators"
        run: npm run translate
        working-directory: tests

      # Five deliberately different installs end to end: coherent guide, script
      # bash accepts, and the Arch Wiki's canonical command order.
      - name: "Test: five install guides"
        run: npm run parity
        working-directory: tests

      # Every page loaded and checked for runtime errors, nav, tooltips.
      - name: "Test: page runtime"
        run: npm run runtime
        working-directory: tests

      - name: "Test: HTML validity"
        run: npm run html
        working-directory: tests

      - name: Download Static Latest Release
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: security-tools-all
          path: './website/static-releases'
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './website'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
