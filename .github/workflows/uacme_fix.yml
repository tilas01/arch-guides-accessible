name: Build uacme_fix (Windows)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'uacme_fix/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'uacme_fix/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: x86_64-pc-windows-msvc

    - name: Build Release Binary
      working-directory: ./uacme_fix
      run: cargo build --release --target x86_64-pc-windows-msvc

    - name: Generate SHA256 Hash
      working-directory: ./uacme_fix/target/x86_64-pc-windows-msvc/release
      run: |
        $hash = Get-FileHash uacme_fix.exe -Algorithm SHA256
        $hash.Hash | Out-File -FilePath uacme_fix.exe.sha256

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: uacme_fix-windows-x86_64
        path: |
          uacme_fix/target/x86_64-pc-windows-msvc/release/uacme_fix.exe
          uacme_fix/target/x86_64-pc-windows-msvc/release/uacme_fix.exe.sha256
