name: Rust Installer Release

on:
  push:
    branches:
      - main
    paths:
      - 'rust-installer/**'
  workflow_dispatch:

jobs:
  build:
    name: Reproducible Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compile Release Binary
        run: |
          cd rust-installer
          cargo build --release
          cp target/release/arch-installer ../arch-installer-linux-x86_64
          cd ..
          sha256sum arch-installer-linux-x86_64 > arch-installer-linux-x86_64.sha256

      - name: GPG Sign Release
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import
          gpg --batch --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" --detach-sign --armor arch-installer-linux-x86_64
          gpg --batch --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" --detach-sign --armor arch-installer-linux-x86_64.sha256

      - name: Publish Latest Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Build
          files: |
            arch-installer-linux-x86_64
            arch-installer-linux-x86_64.sha256
            arch-installer-linux-x86_64.asc
            arch-installer-linux-x86_64.sha256.asc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
