name: Security Tools CI & Release

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: arch-rusty-security-suite
  RELEASE_BINARY: arch-rusty-security-suite-linux-x86_64

jobs:
  # ── Job 1: Build, Lint & Test the unified security suite ─────────────────────
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (Stable, pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Linux evdev headers
        run: sudo apt-get install -y libevdev-dev

      - name: Build unified binary (release)
        run: |
          cd security-tools
          cargo build --release --locked
          sha256sum target/release/${{ env.BINARY_NAME }} > target/release/${{ env.BINARY_NAME }}.sha256
          echo "SHA256:"
          cat target/release/${{ env.BINARY_NAME }}.sha256

      - name: Clippy
        run: cd security-tools && cargo clippy --workspace -- -D warnings

      - name: Format check
        run: cd security-tools && cargo fmt --all -- --check

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BINARY }}
          path: |
            security-tools/target/release/${{ env.BINARY_NAME }}
            security-tools/target/release/${{ env.BINARY_NAME }}.sha256

  # ── Job 2: Release to GitHub Releases (only on push to main) ────────────────
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (Stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux evdev headers
        run: sudo apt-get install -y libevdev-dev

      - name: Build release binary
        run: |
          cd security-tools
          cargo build --release --locked
          cp target/release/${{ env.BINARY_NAME }} ../${{ env.RELEASE_BINARY }}
          cd ..
          sha256sum ${{ env.RELEASE_BINARY }} > ${{ env.RELEASE_BINARY }}.sha256

      - name: GPG Sign Binary
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            gpg --batch --pinentry-mode loopback \
                --passphrase "$GPG_PASSPHRASE" \
                --detach-sign --armor "${{ env.RELEASE_BINARY }}"
            gpg --batch --pinentry-mode loopback \
                --passphrase "$GPG_PASSPHRASE" \
                --detach-sign --armor "${{ env.RELEASE_BINARY }}.sha256"
            echo "GPG_SIGNED=true" >> $GITHUB_ENV
          else
            echo "GPG_PRIVATE_KEY secret not set — skipping GPG signing"
            echo "GPG_SIGNED=false" >> $GITHUB_ENV
          fi

      - name: Generate version tag
        id: version
        run: |
          VERSION="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Arch Rusty Security Suite ${{ steps.version.outputs.version }}"
          body: |
            ## Arch Rusty Security Suite by tilas01

            A single unified binary containing all security tools for Arch Linux.

            ### Subcommands
            | Command | Description |
            |---------|-------------|
            | `arch-rusty-security-suite otp` | Native Rust TOTP/OTP 2FA for PAM (Boot/Login/SSH) |
            | `arch-rusty-security-suite input-guard` | USB HID Input Guard — RubberDucky/BadUSB detector & sandbox |
            | `arch-rusty-security-suite verify-iso` | Verify Arch Linux ISO integrity against SHA-256 checksums |
            | `arch-rusty-security-suite verify-release` | Verify a downloaded release binary against its SHA-256 hash |

            ### Quick Start
            ```bash
            chmod +x arch-rusty-security-suite-linux-x86_64
            ./arch-rusty-security-suite-linux-x86_64 --help
            ```

            ---

            ### Integrity Verification

            **1. SHA-256 Checksum (quick):**
            ```bash
            sha256sum -c arch-rusty-security-suite-linux-x86_64.sha256
            ```

            **2. Manual SHA-256 check:**
            ```bash
            sha256sum arch-rusty-security-suite-linux-x86_64
            # Compare output to contents of arch-rusty-security-suite-linux-x86_64.sha256
            ```

            **3. Self-verify using the suite itself:**
            ```bash
            ./arch-rusty-security-suite-linux-x86_64 verify-release \
                arch-rusty-security-suite-linux-x86_64 \
                arch-rusty-security-suite-linux-x86_64.sha256
            ```

            **4. GPG Signature Verification (if signed):**
            ```bash
            # Import the public key (get fingerprint from README)
            gpg --recv-keys <KEY_ID>
            # Verify binary signature
            gpg --verify arch-rusty-security-suite-linux-x86_64.asc \
                         arch-rusty-security-suite-linux-x86_64
            # Verify checksum file signature
            gpg --verify arch-rusty-security-suite-linux-x86_64.sha256.asc \
                         arch-rusty-security-suite-linux-x86_64.sha256
            ```

            ### Reproducible Build
            Clone the repo and build yourself to verify the binary matches:
            ```bash
            git clone https://github.com/tilas01/arch-guides-dynamic.git
            cd arch-guides-dynamic/security-tools
            cargo build --release --locked
            sha256sum target/release/arch-rusty-security-suite
            # Must match the hash in arch-rusty-security-suite-linux-x86_64.sha256
            ```

            Built with Rust `stable` toolchain. Use `cargo build --release --locked`
            with the pinned `Cargo.lock` to get the exact same binary hash.

            *Commit: ${{ github.sha }}*
          files: |
            ${{ env.RELEASE_BINARY }}
            ${{ env.RELEASE_BINARY }}.sha256
            ${{ env.GPG_SIGNED == 'true' && format('{0}.asc', env.RELEASE_BINARY) || '' }}
            ${{ env.GPG_SIGNED == 'true' && format('{0}.sha256.asc', env.RELEASE_BINARY) || '' }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
