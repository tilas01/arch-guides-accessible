name: Rust Reproducible Builds

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust (Stable)
      uses: dtolnay/rust-toolchain@stable

    - name: Build Anti-RubberDucky
      run: |
        cd security-tools/anti-ducky
        cargo build --release --locked
        
    - name: Build Libre-OTP
      run: |
        cd security-tools/libre-otp
        cargo build --release --locked

    - name: Upload Anti-Ducky Artifact
      uses: actions/upload-artifact@v4
      with:
        name: anti-ducky-linux-x86_64
        path: security-tools/anti-ducky/target/release/anti-ducky
        
    - name: Upload Libre-OTP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libre-otp-linux-x86_64
        path: security-tools/libre-otp/target/release/libre-otp
