name: Security Tools CI & Release

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Job 1: Build ALL tools individually + unified suite ─────────────────────
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (Stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install evdev headers
        run: sudo apt-get update && sudo apt-get install -y libevdev-dev

      # Check workspace can resolve and compile
      - name: Check workspace compiles
        run: |
          set -o pipefail
          cd security-tools
          cargo check --workspace 2>&1 | tee /tmp/cargo-check-output.txt
        env:
          RUST_BACKTRACE: 1

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-check-output
          path: /tmp/cargo-check-output.txt

      # Build everything from workspace root
      - name: Build all workspace members (release)
        run: |
          set -o pipefail
          cd security-tools
          cargo build --release 2>&1 | tee /tmp/cargo-build-output.txt
          echo "=== All binaries ==="
          ls -la target/release/anti-ducky target/release/libre-otp target/release/arch-iso-verifier target/release/scarecrow target/release/kernel-watcher target/release/arch-rusty-security-suite || echo "Some binaries missing"
          echo ""
          echo "=== SHA256 Hashes ==="
          sha256sum target/release/anti-ducky target/release/libre-otp target/release/arch-iso-verifier target/release/scarecrow target/release/kernel-watcher target/release/arch-rusty-security-suite || true

      - name: Upload build output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-build-output
          path: /tmp/cargo-build-output.txt

      # Verify all hashes are reproducible (build twice, compare)
      - name: Reproducibility check
        run: |
          cd security-tools
          # Save first build hashes
          sha256sum target/release/arch-rusty-security-suite > /tmp/hash1_suite.txt
          
          # Clean and rebuild
          cargo clean
          cargo build --release
          
          # Compare suite hash
          sha256sum target/release/arch-rusty-security-suite > /tmp/hash2_suite.txt
          
          echo "=== Reproducibility Results ==="
          echo "arch-rusty-security-suite:"
          diff <(cut -d' ' -f1 /tmp/hash1_suite.txt) <(cut -d' ' -f1 /tmp/hash2_suite.txt) && echo "  ✓ REPRODUCIBLE" || echo "  ✗ NOT REPRODUCIBLE"

      - name: Clippy (workspace)
        run: cd security-tools && cargo clippy --workspace -- -D warnings

      - name: Format check
        run: cd security-tools && cargo fmt --all -- --check

      # Upload all artifacts
      - name: Upload individual + suite artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-tools-all
          path: |
            security-tools/target/release/anti-ducky
            security-tools/target/release/libre-otp
            security-tools/target/release/arch-iso-verifier
            security-tools/target/release/scarecrow
            security-tools/target/release/kernel-watcher
            security-tools/target/release/arch-rusty-security-suite

  # ── Job 2: Release (only on push to main, after CI passes) ──────────────────
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (Stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install evdev headers
        run: sudo apt-get update && sudo apt-get install -y libevdev-dev

      - name: Build all release binaries
        run: |
          cd security-tools
          cargo build --release --workspace
          
          # Copy all binaries to release staging
          mkdir -p ../release-staging
          cp target/release/anti-ducky ../release-staging/anti-ducky-linux-x86_64
          cp target/release/libre-otp ../release-staging/libre-otp-linux-x86_64
          cp target/release/arch-iso-verifier ../release-staging/arch-iso-verifier-linux-x86_64
          cp target/release/scarecrow ../release-staging/scarecrow-linux-x86_64
          cp target/release/kernel-watcher ../release-staging/kernel-watcher-linux-x86_64
          cp target/release/arch-rusty-security-suite ../release-staging/arch-rusty-security-suite-linux-x86_64
          
          # Generate SHA256 for each
          cd ../release-staging
          for f in *-linux-x86_64; do
            sha256sum "$f" > "${f}.sha256"
          done
          
          echo "=== Release Artifacts ==="
          ls -la
          echo ""
          echo "=== Hashes ==="
          cat *.sha256

      - name: GPG Sign All Binaries
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd release-staging
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            for f in *-linux-x86_64 *.sha256; do
              gpg --batch --pinentry-mode loopback \
                  --passphrase "$GPG_PASSPHRASE" \
                  --detach-sign --armor "$f"
            done
            echo "GPG_SIGNED=true" >> $GITHUB_ENV
          else
            echo "No GPG key — skipping signing"
            echo "GPG_SIGNED=false" >> $GITHUB_ENV
          fi

      - name: Generate version tag
        id: version
        run: |
          VERSION="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Arch Rusty Security Suite ${{ steps.version.outputs.version }}"
          body: |
            ## Arch Rusty Security Suite by tilas01

            ### Downloads
            You can download the **full unified suite** (recommended) or **individual tools**:

            | Binary | Description | Use |
            |--------|-------------|-----|
            | `arch-rusty-security-suite-linux-x86_64` | **Full Suite (Recommended)** — all tools in one binary | `./arch-rusty-security-suite otp`, `input-guard`, `scarecrow`, `kernel-watcher`... |
            | `kernel-watcher-linux-x86_64` | Kernel Watcher standalone | Semi-EDR daemon, Rootkit/Infostealer monitoring |
            | `scarecrow-linux-x86_64` | Libre-Cyber-ScareCrow standalone | Malware sandbox spoofing (VBox, Wireshark, etc.) |
            | `anti-ducky-linux-x86_64` | Input Guard standalone | USB HID sandbox & RubberDucky detector |
            | `libre-otp-linux-x86_64` | Libre OTP standalone | TOTP/OTP 2FA for PAM |
            | `arch-iso-verifier-linux-x86_64` | ISO Verifier standalone | Verify Arch ISO integrity |

            Each binary has a `.sha256` file and (if GPG key configured) an `.asc` GPG signature.

            ### Quick Setup (Full Suite — Recommended)
            ```bash
            # Download
            curl -LO "https://github.com/tilas01/arch-guides-dynamic/releases/download/${{ steps.version.outputs.version }}/arch-rusty-security-suite-linux-x86_64"
            curl -LO "https://github.com/tilas01/arch-guides-dynamic/releases/download/${{ steps.version.outputs.version }}/arch-rusty-security-suite-linux-x86_64.sha256"

            # Verify integrity
            sha256sum -c arch-rusty-security-suite-linux-x86_64.sha256

            # Install
            chmod +x arch-rusty-security-suite-linux-x86_64
            sudo cp arch-rusty-security-suite-linux-x86_64 /usr/local/bin/arch-rusty-security-suite

            # Setup all services
            arch-rusty-security-suite otp --setup
            arch-rusty-security-suite input-guard --init
            ```

            ### Individual Tool Download
            ```bash
            # Example: just anti-ducky
            curl -LO "https://github.com/tilas01/arch-guides-dynamic/releases/download/${{ steps.version.outputs.version }}/anti-ducky-linux-x86_64"
            curl -LO "https://github.com/tilas01/arch-guides-dynamic/releases/download/${{ steps.version.outputs.version }}/anti-ducky-linux-x86_64.sha256"
            sha256sum -c anti-ducky-linux-x86_64.sha256
            chmod +x anti-ducky-linux-x86_64
            sudo cp anti-ducky-linux-x86_64 /usr/local/bin/anti-ducky
            ```

            ### Auto Deploy (Recommended)
            Download and review, then run:
            ```bash
            curl -LO https://raw.githubusercontent.com/tilas01/arch-guides-dynamic/main/scripts/deploy-security-suite.sh
            less deploy-security-suite.sh  # review first!
            sudo bash deploy-security-suite.sh
            ```

            ### Integrity Verification
            **SHA-256:** `sha256sum -c <binary>.sha256`
            **GPG:** `gpg --verify <binary>.asc <binary>`
            **Reproducible Build:**
            ```bash
            git clone https://github.com/tilas01/arch-guides-dynamic.git
            cd arch-guides-dynamic/security-tools
            cargo build --release --locked
            sha256sum target/release/arch-rusty-security-suite
            # Must match arch-rusty-security-suite-linux-x86_64.sha256
            ```

            *Commit: ${{ github.sha }}*
          files: |
            release-staging/*
            scripts/deploy-security-suite.sh
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
